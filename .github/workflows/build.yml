name: Build Arduino Sketch (ESP32)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 'latest'

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.0

      - name: Install RF24 library
        run: |
          arduino-cli lib install "RF24"

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 bt_jammer.ino

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt-jammer-firmware
          path: build/*.bin
          retention-days: 30
